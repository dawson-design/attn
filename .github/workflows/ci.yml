name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A second push to the same branch cancels the older run; only the tip matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; it never needs a writable token, so drop the default
# scope to read-only for the untrusted branch code it runs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Actions pinned to a full commit SHA: a mutable tag (v4/v2) can be
      # retagged to point at malicious code that would then run in CI.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # --frozen-lockfile: CI installs exactly what bun.lock pins and fails if
      # the lockfile is out of date, rather than silently resolving new versions.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The steps below are listed individually rather than as `bun run ci` so a
      # failure names the gate that broke. They are the same commands, in the
      # same order, that `bun run ci` runs locally.
      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # shellcheck is preinstalled on ubuntu-latest runners.
      - name: Lint shell scripts
        run: bun run lint:shell

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Proves the production build still works, which none of the gates above
      # cover: adapter-node output is what `bun run serve` and the LaunchAgent run.
      - name: Build
        run: bun run build
